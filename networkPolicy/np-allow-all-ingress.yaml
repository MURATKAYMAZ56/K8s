apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: np-allow-all-ingress
  namespace: staging
#add spec to apply th is policy for all Pods
spec:
  policyTypes:
  - Ingress. # check for incomming traffic
  podSelector: {} # select all pods in the namespace
  ingress:
    - {} ## allow all ingress traffic