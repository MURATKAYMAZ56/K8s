apiVersion: v1
kind: Pod
metadata:
  name: brezyweather
  namespace: staging
  labels:
    app: weather
spec:
  containers:
  - name: brezyweather
    image: codewithpraveen/labs-k8s-brezyweather:1.0
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
    - containerPort: 80